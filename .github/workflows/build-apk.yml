# 개략공사비 안드로이드 앱(APK) 자동 빌드
# 파일을 올리거나 Actions 탭에서 "Run workflow"를 누르면 APK를 만들어 Releases에 올립니다.
name: APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 안드로이드 SDK 확인 (빌드 서버에 기본 설치됨)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: 앱 껍데기(Capacitor) 만들기
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png app/www/
          cd app
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "개략공사비" kr.japtomok.grs --web-dir www
          npx cap add android
          npx cap sync android

      - name: 아이콘·권한·버전 설정
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          res = 'app/android/app/src/main/res'
          src = Image.open('icon-512.png').convert('RGBA')
          bg = src.getpixel((4, 4))
          hexbg = '#%02x%02x%02x' % bg[:3]
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              src.resize((s, s), Image.LANCZOS).save(f'{p}/ic_launcher.png')
              src.resize((s, s), Image.LANCZOS).save(f'{p}/ic_launcher_round.png')
              fg = round(s * 108 / 48)
              inner = round(fg * 0.70)
              canvas = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), ((fg - inner) // 2, (fg - inner) // 2))
              canvas.save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/gaeryak_icon_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(f'{res}/mipmap-anydpi-v26/{n}', 'w').write(xml)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/gaeryak_colors.xml', 'w').write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="gaeryak_icon_bg">{hexbg}</color>\n</resources>\n')
          m = 'app/android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          if 'android.permission.CAMERA' not in t:
              t = t.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
          open(m, 'w').write(t)
          g = 'app/android/app/build.gradle'
          t = open(g).read()
          import re
          n = os.environ.get('GITHUB_RUN_NUMBER', '1')
          t = re.sub(r'versionCode \d+', f'versionCode {n}', t)
          t = re.sub(r'versionName "[^"]*"', f'versionName "1.{n}"', t)
          open(g, 'w').write(t)
          PY

      - name: 서명 키 준비 (업데이트 설치가 되도록 매번 같은 키 사용)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: APK 빌드
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GRS.apk"

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk GRS.apk --title "개략공사비 앱 (빌드 ${{ github.run_number }})" --notes "폰에서 GRS.apk 를 눌러 받은 뒤 설치하세요." --latest
