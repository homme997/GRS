<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잡토목 개략공사비</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: 현장 야장(field book) 같은 한 줄 기입 → 공종별 묶음 → 원가계산서. 상단 프로젝트 바, 탭 4개, 우측(넓은 화면) 합계 고정 */
:root{
  --bg:#edf0ec; --surface:#fafbf9; --sunk:#e3e8e3; --ink:#18201c; --muted:#5a665f; --line:#cad2cb;
  --accent:#2a4ea3; --accent-ink:#ffffff; --mark:#e2560f; --warn-bg:#fff3d6; --warn-ink:#7a4b00; --bad:#b42318;
  --c-road:#2a4ea3; --c-drain:#0f7c86; --c-wall:#6b4fa8; --c-river:#3f7d2c; --c-waste:#8a6a1f;
  --f-body:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono","Consolas",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141916; --surface:#1c231f; --sunk:#111512; --ink:#e4ebe6; --muted:#9aa8a0; --line:#334039;
  --accent:#7c9cf0; --accent-ink:#0d1530; --mark:#ff8a47; --warn-bg:#3a2e12; --warn-ink:#f3cf83; --bad:#ff7b6e;
  --c-road:#7c9cf0; --c-drain:#4fc2cc; --c-wall:#ad95e8; --c-river:#86c56f; --c-waste:#d4b25c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --surface:#1c231f; --sunk:#111512; --ink:#e4ebe6; --muted:#9aa8a0; --line:#334039;
  --accent:#7c9cf0; --accent-ink:#0d1530; --mark:#ff8a47; --warn-bg:#3a2e12; --warn-ink:#f3cf83; --bad:#ff7b6e;
  --c-road:#7c9cf0; --c-drain:#4fc2cc; --c-wall:#ad95e8; --c-river:#86c56f; --c-waste:#d4b25c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;min-height:34px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad)}
button.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:34px;width:100%;min-width:0}
input.n{font-family:var(--f-num);text-align:right}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f > input,label.f > select{color:var(--ink);font-size:14px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--c-river)} .dot.busy{background:var(--mark)} .dot.err{background:var(--bad)}

.projbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(0,1.8fr) repeat(2,minmax(0,.75fr));gap:10px;align-items:end}
.projbar .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:820px){.projbar{grid-template-columns:repeat(2,minmax(0,1fr))}.projbar .wide{grid-column:1/-1}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}

.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:8px 12px;font-size:13px}

/* 공종 섹션 */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat > header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cat > header .t{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.cat .sum{font-family:var(--f-num);font-weight:600}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.lines{display:flex;flex-direction:column}
.lhead,.line{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,2.2fr) minmax(0,.9fr) 2.6rem minmax(0,1.15fr) 2rem;gap:6px;align-items:center;padding:6px 12px}
.lhead{font-size:11px;color:var(--muted);background:var(--sunk);padding-block:5px}
.lhead span.r{text-align:right}
.line{border-top:1px solid var(--line)}
.line:first-of-type{border-top:none}
.line .unit{color:var(--muted);font-size:12px;text-align:center}
.line .amt{text-align:right;font-family:var(--f-num);font-size:13px}
.line .hint{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-2px}
.line .hint.bad{color:var(--bad)}
.line select{font-size:13px}
.line input{font-size:13px}
.empty{padding:12px;color:var(--muted);font-size:13px}
.cat footer{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:720px){
  .lhead{display:none}
  .line{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"it it it it it del" "lc lc lc lc lc lc" "qt qt un am am am";row-gap:6px;padding-block:10px}
  .line > .c-it{grid-area:it}.line > .c-lc{grid-area:lc}
  .line > .c-qt{grid-area:qt}.line > .unit{grid-area:un;text-align:left}.line > .amt{grid-area:am}.line > .c-del{grid-area:del}
  .line input::placeholder{color:var(--muted)}
}

/* 합계 패널 */
.totals{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:980px){.totals{position:static}}
.big{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.big small{font-size:14px;color:var(--muted);font-weight:400}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv .v{font-family:var(--f-num)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.bar .trk{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .fill{height:100%}
.bar .v{font-family:var(--f-num)}
hr{border:none;border-top:1px solid var(--line);margin:0}

/* 단가표 */
.book .row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) 4.2rem repeat(3,minmax(0,1fr)) minmax(0,1fr) 2rem;gap:6px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.book .row.h{font-size:11px;color:var(--muted);background:var(--sunk);border-top:none;padding-block:5px}
.book .row.h span.r{text-align:right}
.book .tot{font-family:var(--f-num);text-align:right;font-size:13px}
.ex{font-size:10px;color:var(--mark);border:1px solid var(--mark);border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
@media (max-width:720px){
  .book .row.h{display:none}
  .book .row{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"nm nm nm nm nm del" "sp sp sp sp un un" "ma ma la la ex ex" "tt tt tt tt tt tt";padding-block:10px}
  .book .b-nm{grid-area:nm}.book .b-sp{grid-area:sp}.book .b-un{grid-area:un}.book .b-ma{grid-area:ma}.book .b-la{grid-area:la}.book .b-ex{grid-area:ex}.book .tot{grid-area:tt}.book .b-del{grid-area:del}
}

/* 요율 */
.rates{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 7rem;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:none}
.rrow .b{font-size:12px;color:var(--muted)}
@media (max-width:620px){.rrow{grid-template-columns:minmax(0,1fr) 6.5rem}.rrow .b{grid-column:1/-1;order:3;margin-top:-4px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:none;border-radius:0;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 원가계산서 */
.sheet-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.sheet{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sheet th{font-size:11px;color:var(--muted);font-weight:500;background:var(--sunk)}
.sheet td.a{text-align:right;font-family:var(--f-num);white-space:nowrap}
.sheet td.b{color:var(--muted);font-size:12px}
.sheet tr.l1 td:first-child{padding-left:10px;font-weight:600}
.sheet tr.l2 td:first-child{padding-left:24px}
.sheet tr.l3 td:first-child{padding-left:40px;color:var(--muted)}
.sheet tr.tot td{font-weight:700;background:var(--sunk)}
.sheet tr.grand td{font-weight:700;border-top:2px solid var(--mark)}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;z-index:20}
.loading{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;z-index:30;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}
.main.solo{grid-template-columns:minmax(0,1fr)}
.main.solo .totals{display:none}
/* 자재단가 */
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtools input[type=search]{flex:1 1 200px;width:auto}
.mgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mgroup > header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.mgroup .need{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mgroup .need input{width:6.5rem}
.mat{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.mat:first-of-type{border-top:none}
.mat.best{background:color-mix(in srgb,var(--c-river) 9%,var(--surface))}
.thumb{width:64px;height:64px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;padding:0;min-height:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mat .nm{font-weight:600;overflow-wrap:anywhere}
.mat .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mat .pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mat .pr .p{font-family:var(--f-num);font-weight:600}
.mat .pr .u{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.badge.best{background:var(--c-river);color:var(--surface);font-weight:600}
.badge.diff{border:1px solid var(--line);color:var(--muted);font-family:var(--f-num)}
.mat .tot{font-family:var(--f-num);font-size:12px}
.mat .acts{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.mat .acts button{min-height:30px;padding:3px 10px;font-size:12px}
.editor{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.editor h2{grid-column:1/-1}
.editor .w2{grid-column:span 2}.editor .w4{grid-column:1/-1}
.editor .ph{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editor .ph .thumb{width:96px;height:96px}
.editor .bar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.editor{grid-template-columns:repeat(2,minmax(0,1fr))}.editor .w2{grid-column:1/-1}}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>잡토목 개략공사비</h1>
      <div class="sub">주요수량 × 실적단가 → 원가계산 제비율 → 총공사비</div>
    </div>
    <div class="save" id="saveState"><span class="dot" id="saveDot"></span><span id="saveText">불러오는 중</span></div>
  </div>

  <section class="projbar" aria-label="프로젝트">
    <label class="f"><span>프로젝트</span><select id="projSel"></select></label>
    <label class="f wide"><span>공사명</span><input id="projName" type="text" autocomplete="off"></label>
    <label class="f"><span>기준 연장 (m)</span><input id="projLen" class="n" inputmode="decimal" placeholder="선택"></label>
    <label class="f"><span>단가 보정률 (%)</span><input id="projAdj" class="n" inputmode="decimal" placeholder="0"></label>
    <div class="acts">
      <button id="btnNew">새 프로젝트</button>
      <button id="btnDup">복제</button>
      <button id="btnDel" class="danger">프로젝트 삭제</button>
      <span style="flex:1"></span>
      <button id="btnExport">백업 파일 저장</button>
      <button id="btnImport">백업 불러오기</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="calc" aria-selected="true">수량 입력</button>
    <button role="tab" data-tab="sheet" aria-selected="false">원가계산서</button>
    <button role="tab" data-tab="book" aria-selected="false">단가표</button>
    <button role="tab" data-tab="rates" aria-selected="false">제비율</button>
    <button role="tab" data-tab="mats" aria-selected="false">자재단가</button>
  </nav>

  <div class="main">
    <div class="panel" id="view"></div>
    <aside class="totals" id="totals" aria-label="합계"></aside>
  </div>
</div>
<div class="loading" id="loading">불러오는 중…</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="자재 사진"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="photoCam" accept="image/*" capture="environment" hidden>

<script>
(() => {
'use strict';
const CATS = [
  {k:'road', n:'도로·포장', c:'var(--c-road)'},
  {k:'drain',n:'배수·우수', c:'var(--c-drain)'},
  {k:'wall', n:'옹벽·구조물', c:'var(--c-wall)'},
  {k:'river',n:'하천·부지조성', c:'var(--c-river)'},
  {k:'waste',n:'폐기물', c:'var(--c-waste)'}
];
const CATN = Object.fromEntries(CATS.map(c=>[c.k,c]));
const uid = () => Math.random().toString(36).slice(2,10);
const $ = s => document.querySelector(s);
const NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform());
function nativeCall(plugin, method, opts){
  const C = window.Capacitor;
  const P = C.Plugins && C.Plugins[plugin];
  if(P && typeof P[method]==='function') return P[method](opts);
  if(typeof C.nativePromise==='function') return C.nativePromise(plugin, method, opts);
  return Promise.reject(new Error('plugin unavailable'));
}
const esc = s => String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const toN = v => { if(v===''||v==null) return 0; const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; };
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const fmtQ = n => (Math.round(n*1000)/1000).toLocaleString('ko-KR',{maximumFractionDigits:3});
const won = n => fmt(n)+'원';
const eok = n => { const a=Math.abs(n); if(a>=1e8) return (n/1e8).toLocaleString('ko-KR',{maximumFractionDigits:2})+'억원'; if(a>=1e4) return (n/1e4).toLocaleString('ko-KR',{maximumFractionDigits:0})+'만원'; return won(n); };

/* ---------- 기본값 (모두 예시) ---------- */
const S = (cat,name,spec,unit,mat,lab,exp) => ({id:uid(),cat,name,spec,unit,mat,lab,exp,sample:true});
const defaultBook = () => ({items:[
  S('road','터파기','토사, 기계','m³',0,1200,2300),
  S('road','되메우기','기계, 다짐','m³',0,2500,1800),
  S('road','보조기층','T=20cm','m²',4800,900,700),
  S('road','아스콘포장','표층 T=5cm','m²',9500,1300,900),
  S('road','콘크리트포장','T=20cm','m²',26000,9000,1500),
  S('road','L형측구','W=0.8m','m',18000,14000,1200),
  S('road','도로경계석','화강석 180×200','m',21000,11000,800),
  S('drain','흄관','D600','m',72000,18000,9000),
  S('drain','PE이중벽관','D300','m',21000,9000,3000),
  S('drain','집수정','0.8×0.8m','개소',380000,290000,30000),
  S('drain','우수맨홀','Ø900','개소',650000,420000,60000),
  S('drain','U형측구','300×300','m',24000,15000,2000),
  S('wall','철근콘크리트','25-24-15','m³',98000,45000,6000),
  S('wall','거푸집','합판 3회','m²',9000,28000,1000),

function parseSta(s, interval){
  if(s==null) return null;
  let t = String(s).trim().toUpperCase().replace(/\s+/g,'');
  if(!t) return null;
  t = t.replace(/^STA\.?/,'');
  let m;
  if((m = t.match(/^NO\.?(\d+)(?:\+([\d.]+))?$/))) return (+m[1])*interval + (m[2]?+m[2]:0);
  if((m = t.match(/^(\d+)\+([\d.]+)$/))) return (+m[1])*1000 + (+m[2]);
  if(/^\d+(\.\d+)?$/.test(t)) return +t;
  return NaN;
}

/* ---------- 계산 ---------- */
function lineCost(ln, adj){
  const it = itemOf(ln.itemId);
  const q = toN(ln.qty);
  if(!it) return {M:0,L:0,E:0,T:0,missing:true};
  const f = 1 + adj/100;
  let m = toN(it.mat), l = toN(it.lab), e = toN(it.exp);
  const base = m+l+e;
  if(ln.ovr !== '' && ln.ovr != null){
    const o = toN(ln.ovr);
    if(base>0){ const s=o/base; m*=s; l*=s; e*=s; } else { m=0; l=0; e=o; }
  }
  const M=q*m*f, L=q*l*f, E=q*e*f;
  return {M,L,E,T:M+L+E,unit:(m+l+e)*f};
}
function calc(p){
  const adj = toN(p.adj);
  const byCat = {}; CATS.forEach(c=>byCat[c.k]={M:0,L:0,E:0,T:0,n:0});

  const sepCats = rates.sepWaste ? ['waste'] : [];
  let M=0,L=0,E=0,sep=0;
  for(const c of CATS){ const b=byCat[c.k]; if(sepCats.includes(c.k)) sep+=b.T; else {M+=b.M;L+=b.L;E+=b.E;} }
  const fl = Math.floor, r = k => toN(rates[k])/100;
  const rows = [];

    rows.push({lv:1,l:'직접공사비',b:'재료비 + 노무비 + 경비',a:D});
    rows.push({lv:2,l:'재료비',b:'',a:fl(M)},{lv:2,l:'노무비',b:'',a:fl(L)},{lv:2,l:'경비',b:'',a:fl(E)});
    rows.push({lv:1,l:'간접비·제경비 (일괄)',b:`직접공사비 × ${rates.simpleRate}%`,a:ov});
    rows.push({lv:1,l:'공사원가',b:'',a:costBeforeVat,cls:'tot'});
    rows.push({lv:1,l:'부가가치세',b:`공사원가 × ${rates.vat}%`,a:vat});
  } else {
    const Mi=fl(M), Ld=fl(L), Ed=fl(E);

    const e1=fl(Lt*r('industrial')), e2=fl(Lt*r('employment')), e3=fl(Ld*r('health')), e4=fl(e3*r('longterm')),

    const Et = Ed+e1+e2+e3+e4+e5+e6+e7+e8+e9;

    rows.push({lv:1,l:'재료비',b:'',a:Mi});
    rows.push({lv:1,l:'노무비',b:'',a:Lt});
    rows.push({lv:2,l:'직접노무비',b:'',a:Ld});
    rows.push({lv:2,l:'간접노무비',b:`직접노무비 × ${rates.indirectLabor}%`,a:Li});
    rows.push({lv:1,l:'경비',b:'',a:Et});
    rows.push({lv:2,l:'산출경비 (단가표 경비)',b:'',a:Ed});

    rows.push({lv:2,l:'노인장기요양보험료',b:`건강보험료 × ${rates.longterm}%`,a:e4});
    rows.push({lv:2,l:'국민연금보험료',b:`직접노무비 × ${rates.pension}%`,a:e5});

    rows.push({lv:1,l:'이윤',b:`(노무비+경비+일반관리비) × ${rates.profit}%`,a:pf});
    rows.push({lv:1,l:'공사원가',b:'',a:costBeforeVat,cls:'tot'});
    rows.push({lv:1,l:'부가가치세',b:`공사원가 × ${rates.vat}%`,a:vat});
  }
  const contract = costBeforeVat+vat;
  rows.push({lv:1,l:'도급공사비',b:'공사원가 + 부가가치세',a:contract,cls:'tot'});

const timers = {}; const writing = {}; const dirty = {};
function setSave(state,text){ $('#saveDot').className='dot '+state; $('#saveText').textContent=text; }
function storeLabel(){ return store.kind==='local' ? '이 기기에 저장됨 · 오프라인 사용 가능' : '저장 안 됨'; }
function schedule(key){
  if(!ready) return;
  dirty[key]=true;
  clearTimeout(timers[key]);
  setSave('busy','저장 대기…');
  timers[key]=setTimeout(()=>flush(key),900);
}
async function flush(key){
  if(writing[key]){ timers[key]=setTimeout(()=>flush(key),400); return; }
  if(!dirty[key]) return;
  dirty[key]=false; writing[key]=true;
  try{
    if(store.kind==='local'){
      localStorage.setItem('jcost.v1', JSON.stringify({book,rates,projects,curId,mats}));
    }
    setSave('ok',storeLabel());
  }catch(e){
    if(e && e.code==='unavailable'){ dirty[key]=true; setTimeout(()=>flush(key),1500+Math.random()*1000); setSave('busy','다시 저장 시도 중…'); }
    else setSave('err', e && e.code==='quota_exceeded' ? '저장 공간이 가득 찼어요 — 안 쓰는 프로젝트를 지워 주세요' : '저장하지 못했어요 — 네트워크를 확인해 주세요');
  }finally{ writing[key]=false; }
}

        let msg='', bad=false;
        if(ln.itemId && !it){ msg='단가표에서 삭제된 항목이라 금액이 0원이에요. 다른 항목을 고르세요.'; bad=true; }
        if(it && toN(ln.qty)>0) msg = (msg? msg+' · ':'') + `단가 ${fmt(c.unit)}원/${it.unit}${ln.ovr!==''&&ln.ovr!=null?' (수정 단가)':''}`;
        hint.textContent = msg; hint.hidden = !msg; hint.classList.toggle('bad',bad);
      }
    }
    for(const c of CATS){ const el=document.querySelector(`[data-catsum="${c.k}"]`); if(el) el.textContent = won(res.byCat[c.k].T); }
  }
  renderTotals(res);
}
function renderTotals(res){
  const p = cur(); const el=$('#totals');
  if(!p){ el.innerHTML=''; return; }
  res = res || calc(p);
  const max = Math.max(1,...CATS.map(c=>res.byCat[c.k].T));
  const len = toN(p.len);
  let h = `<div><div class="sub">총 개략공사비 (부가세 포함)</div><div class="big">${eok(res.total)}</div><div class="sub num">${won(res.total)}</div></div>`;
  if(len>0) h += `<div class="kv"><span>m당 공사비 (L=${fmtQ(len)}m)</span><span class="v">${won(Math.round(res.total/len))}</span></div>`;
  h += `<hr><div class="bars">` + CATS.map(c=>{ const t=res.byCat[c.k].T; return `<div class="bar"><span>${c.n}</span><span class="trk"><span class="fill" style="display:block;width:${(t/max*100).toFixed(1)}%;background:${c.c}"></span></span><span class="v">${eok(t)}</span></div>`; }).join('') + `</div><hr>`;
  h += `<div class="kv"><span>직접공사비</span><span class="v">${won(Math.floor(res.direct))}</span></div>`;
  h += `<div class="kv"><span>도급공사비</span><span class="v">${won(res.contract)}</span></div>`;
  if(res.sepTotal) h += `<div class="kv"><span>폐기물 (별도·VAT 포함)</span><span class="v">${won(res.sepTotal)}</span></div>`;
  h += `<div class="sub">${rates.mode==='simple'?`간이 계산: 직접공사비에 제경비 ${rates.simpleRate}% 일괄 적용`:'원가계산 제비율 적용'}${toN(p.adj)?` · 단가 보정 ${p.adj}%`:''}</div>`;
  el.innerHTML = h;
}

function applyAuto(p, ln){
  return; // 측점 입력란 제거 — 연장 자동 계산 사용 안 함
  const intv = toN(p.interval)||20;
  for(const l of (ln?[ln]:p.lines)){
    const it = itemOf(l.itemId); if(!it || it.unit!=='m') continue;
    const fs=parseSta(l.from,intv), ts=parseSta(l.to,intv);
    if(fs==null||ts==null||Number.isNaN(fs)||Number.isNaN(ts)) continue;
    if(l.auto || toN(l.qty)===0){ l.qty = String(Math.round(Math.abs(ts-fs)*1000)/1000); l.auto=true; }
  }
}

function linesTSV(p){
  const adj=toN(p.adj);
  const head=['공종','항목','규격','위치/비고','수량','단위','재료비 단가','노무비 단가','경비 단가','합계 단가','금액'];
  const rows=[head.join('\t')];
  for(const c of CATS) for(const ln of p.lines.filter(l=>l.cat===c.k)){
    const it=itemOf(ln.itemId)||{}; const lc=lineCost(ln,adj); const q=toN(ln.qty)||0;
    const u = q? [lc.M/q, lc.L/q, lc.E/q] : [0,0,0];
    rows.push([c.n,it.name||'',it.spec||'',ln.loc||'',q,it.unit||'',Math.round(u[0]),Math.round(u[1]),Math.round(u[2]),Math.round(u[0]+u[1]+u[2]),Math.round(lc.T)].map(v=>String(v).replace(/\t|\n/g,' ')).join('\t'));
  }
  return rows.join('\n');
}
function sheetTSV(p){ const res=calc(p); return ['비목\t산출 근거\t금액(원)', ...res.rows.map(r=>`${'  '.repeat(r.lv-1)}${r.l}\t${r.b}\t${r.a}`)].join('\n'); }
async function copy(text,msg){

  }
}

/* ---------- 사진 저장소 (IndexedDB) ---------- */
let idbP = null; const photoURL = {};
function idb(){ if(!idbP) idbP = new Promise((res,rej)=>{ try{ const r=indexedDB.open('jcost',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return idbP; }
async function idbDo(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('photos',mode); const st=tx.objectStore('photos'); const rq=fn(st); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const photoPut = (id,blob) => idbDo('readwrite', st=>st.put(blob,id));
const photoGet = id => idbDo('readonly', st=>st.get(id));
const photoDel = id => idbDo('readwrite', st=>st.delete(id)).catch(()=>{});
async function photoSrc(id){
  if(!id) return '';
  if(photoURL[id]) return photoURL[id];
  try{ const b=await photoGet(id); if(b){ photoURL[id]=URL.createObjectURL(b); return photoURL[id]; } }catch(e){}
  return '';
}
async function hydratePhotos(){
  for(const img of document.querySelectorAll('img[data-photo]')){
    const src = await photoSrc(img.dataset.photo);
    if(src){ img.src=src; img.hidden=false; const ph=img.parentElement.querySelector('.noph'); if(ph) ph.hidden=true; }
  }
}
async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=1280, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.82));
  } finally { URL.revokeObjectURL(url); }
}

  let h = '';
  if(mats.some(m=>m.sample)) h += `<div class="note">예시 자재가 들어 있어요. 가격·구입처는 모두 가상의 값입니다. <button data-mact="clearSampleMats" style="margin-left:6px;min-height:28px;padding:2px 10px">예시 자재 지우기</button></div>`;
  h += `<div class="mtools"><input type="search" id="matQ" placeholder="자재명·규격·구입처 검색" value="${esc(matQ)}" aria-label="자재 검색"><button class="primary" data-mact="add">+ 자재 추가</button></div>`;
  if(matEdit) h += matEditor();
  const q = matQ.trim().toLowerCase();
  const list = mats.filter(m=>!q || [m.name,m.spec,m.grp,m.shop,m.memo].join(' ').toLowerCase().includes(q));
  if(!list.length){ h += `<div class="empty">${mats.length?'검색 결과가 없어요.':'아직 등록한 자재가 없어요. "자재 추가"로 자주 쓰는 자재를 넣어 두세요.'}</div>`; return h; }
  const groups = {};
  for(const m of list){ (groups[grpKey(m)] ||= []).push(m); }
  const names = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ko'));
  h += `<div class="sub">같은 <b>비교 그룹</b>에 넣은 자재끼리 기준단위 가격으로 비교해요. 필요 수량을 넣으면 자재별 총액도 나와요.</div>`;
  for(const g of names){
    const arr = groups[g].map(m=>({m,...matBase(m)}));
    const units = [...new Set(arr.map(a=>a.unit))];
    const comparable = units.length===1 && arr.length>1;
    arr.sort((a,b)=>a.u-b.u);
    const best = arr[0].u;
    const need = needQty[g]||'';
    h += `<section class="mgroup" data-grp="${esc(g)}"><header><h2>${esc(g)}</h2>`;
    if(comparable) h += `<label class="need">필요 수량 <input class="n" data-need="${esc(g)}" id="need-${esc(g).replace(/[^a-zA-Z0-9가-힣]/g,'_')}" value="${esc(need)}" inputmode="decimal" placeholder="0"> ${esc(units[0])}</label>`;
    else if(arr.length>1) h += `<span class="tag">기준단위가 달라 비교할 수 없어요 (${units.map(esc).join(', ')})</span>`;
    h += `</header>`;
    for(const a of arr){
      const m=a.m; const isBest = comparable && a.u===best;
      const diff = comparable && !isBest ? a.u-best : 0;
      const per = toN(m.per)||1;
      h += `<div class="mat${isBest?' best':''}" data-mat="${esc(m.id)}">
        <button class="thumb" data-mact="view" aria-label="사진 크게 보기"${m.photo?'':' disabled'}><img data-photo="${esc(m.photo||'')}" alt="" hidden><span class="noph">${m.photo?'':'사진 없음'}</span></button>
        <div style="min-width:0"><div class="nm">${esc(m.name)}${m.sample?'<span class="ex">예시</span>':''}</div>
          <div class="meta">${[m.spec,m.shop,m.date].filter(Boolean).map(esc).join(' · ')}</div>
          ${m.memo?`<div class="meta">${esc(m.memo)}</div>`:''}</div>
        <div class="pr"><span class="p">${fmt(m.price)}원/${esc(m.unit)}</span>
          ${per!==1||(m.baseUnit&&m.baseUnit!==m.unit)?`<span class="u">= ${fmt(a.u)}원/${esc(a.unit)}</span>`:''}
          ${isBest?'<span class="badge best">최저</span>':''}${diff?`<span class="badge diff">+${fmt(diff)}원 (+${(diff/best*100).toFixed(1)}%)</span>`:''}
          ${comparable && toN(need)>0?`<span class="tot">총 ${fmt(a.u*toN(need))}원</span>`:''}</div>
        <div class="acts"><button data-mact="edit">수정</button><button data-mact="dup">복제</button><button class="danger" data-mact="del">삭제</button></div>
      </div>`;
    }
    h += `</section>`;
  }
  return h;
}
function matEditor(){
  const d = matDraft;
  const grps = [...new Set(mats.map(grpKey))].sort((a,b)=>a.localeCompare(b,'ko'));
  const F = (k,label,cls,extra='') => `<label class="f ${cls||''}"><span>${label}</span><input id="md-${k}" data-md="${k}" value="${esc(d[k]??'')}" ${extra}></label>`;
  return `<section class="editor" aria-label="자재 편집"><h2>${mats.some(m=>m.id===d.id)?'자재 수정':'새 자재'}</h2>
    ${F('name','품명 *','w2','autocomplete="off"')}${F('spec','규격','w2','autocomplete="off"')}
    ${F('grp','비교 그룹','w4','list="grpList" autocomplete="off" placeholder="같이 비교할 자재끼리 같은 이름 (예: 우수관 D300)"')}<datalist id="grpList">${grps.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    ${F('price','단가 (원) *','','class="n" inputmode="decimal"')}${F('unit','구매 단위','','placeholder="본, m, m³, 포…"')}
    ${F('per','1단위당 기준수량','','class="n" inputmode="decimal" placeholder="1"')}${F('baseUnit','기준단위','','placeholder="m"')}
    <div class="sub w4">예: 6m짜리 관을 본당 96,000원에 사면 → 구매 단위 "본", 1단위당 기준수량 6, 기준단위 "m" → 16,000원/m로 비교해요.</div>
    ${F('shop','구입처 / 업체','w2','autocomplete="off"')}${F('date','기준일','','type="date"')}
    <span></span>
    ${F('memo','메모','w4','autocomplete="off" placeholder="운반비 포함 여부, 최소 주문량 등"')}
    <div class="ph"><div class="thumb">${d.photo?`<img data-photo="${esc(d.photo)}" alt="자재 사진" hidden>`:''}<span class="noph">${d.photo?'':'사진 없음'}</span></div>
      ${d._busy?'<button disabled>사진 처리 중…</button>':`<button data-mact="cam">${d.photo?'다시 촬영':'사진 촬영'}</button><button data-mact="photo">갤러리에서 선택</button>`}${d.photo?'<button class="danger" data-mact="rmPhoto">사진 빼기</button>':''}</div>
    <div class="bar"><button data-mact="cancel">취소</button><button class="primary" data-mact="save"${d._busy?' disabled':''}>저장</button></div>
  </section>`;
}
function openEditor(m){
  matDraft = m ? JSON.parse(JSON.stringify(m)) : {id:uid(),name:'',spec:'',grp:'',price:'',unit:'',per:'',baseUnit:'',shop:'',date:new Date().toISOString().slice(0,10),memo:'',photo:'',sample:false};
  matDraft._orig = m ? (m.photo||'') : '';
  matDraft._new = [];
  matEdit = matDraft.id; renderView();
  const el=document.getElementById('md-name'); if(el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); }
}
function closeEditor(saved){
  if(matDraft){
    // 저장 안 한 새 사진, 또는 교체되어 안 쓰는 사진 정리
    const keep = saved ? matDraft.photo : matDraft._orig;
    const drop = [...matDraft._new, saved && matDraft._orig!==matDraft.photo ? matDraft._orig : ''].filter(x=>x && x!==keep);
    drop.forEach(photoDel);
  }
  matEdit=null; matDraft=null; renderView();
}
view.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='matQ'){ matQ=t.value; const pos=t.selectionStart; renderView(); const n=$('#matQ'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} return; }
  if(t.dataset.md && matDraft){ matDraft[t.dataset.md]=t.value; return; }
  if(t.dataset.need!==undefined){ needQty[t.dataset.need]=t.value; const g=t.dataset.need, id=t.id, pos=t.selectionStart; renderView(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } }
});
view.addEventListener('click',async e=>{
  const b=e.target.closest('[data-mact]'); if(!b) return;
  const act=b.dataset.mact; const row=b.closest('[data-mat]'); const m=row?mats.find(x=>x.id===row.dataset.mat):null;
  if(act==='add') openEditor(null);
  else if(act==='edit' && m) openEditor(m);
  else if(act==='dup' && m){ const c=JSON.parse(JSON.stringify(m)); c.id=uid(); c.sample=false; c.photo=''; openEditor(null); Object.assign(matDraft,c,{_orig:'',_new:[]}); matEdit=matDraft.id; renderView(); toast('복사본이에요. 가격·구입처를 바꾸고 저장하세요 (사진은 새로 넣어 주세요)'); }
  else if(act==='del' && m){
    if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='한 번 더 누르면 삭제'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('arm'); b.textContent='삭제'; } },3000); return; }
    mats=mats.filter(x=>x.id!==m.id); if(m.photo) photoDel(m.photo); schedule('all'); renderView(); toast('자재를 삭제했어요');
  }
  else if(act==='view' && m && m.photo){ const src=await photoSrc(m.photo); if(src){ $('#viewerImg').src=src; $('#viewer').hidden=false; } }
  else if(act==='photo'){ $('#photoIn').click(); }
  else if(act==='cam'){ $('#photoCam').click(); }
  else if(act==='rmPhoto' && matDraft){ matDraft.photo=''; renderView(); }
  else if(act==='cancel') closeEditor(false);
  else if(act==='save' && matDraft){
    if(!String(matDraft.name).trim()){ toast('품명을 입력해 주세요'); $('#md-name').focus(); return; }
    if(!(toN(matDraft.price)>0)){ toast('단가를 입력해 주세요'); $('#md-price').focus(); return; }
    if(matDraft._busy){ toast('사진을 처리하는 중이에요. 잠시 후 저장해 주세요'); return; }
    const {_orig,_new,_busy,...clean} = matDraft;
    clean.price=toN(clean.price); clean.per=clean.per===''?'':toN(clean.per); clean.sample=false;
    const i=mats.findIndex(x=>x.id===clean.id);
    if(i>=0) mats[i]=clean; else mats.push(clean);
    schedule('all'); closeEditor(true); toast('저장했어요');
  }
  else if(act==='clearSampleMats'){ mats=mats.filter(x=>!x.sample); schedule('all'); renderView(); toast('예시 자재를 지웠어요'); }
});
async function onPhotoPicked(e){
  const f=e.target.files[0]; e.target.value=''; if(!f||!matDraft) return;
  const d=matDraft; d._busy=true; renderView();
  try{
    const blob=await shrinkImage(f); const id='ph_'+uid();
    await photoPut(id,blob);
    d._new.push(id); d.photo=id;
  }catch(err){ toast('사진을 저장하지 못했어요. 다른 사진으로 다시 해 보세요'); }
  finally{ d._busy=false; if(matDraft===d){ renderView(); hydratePhotos(); } else if(d.photo && !mats.some(m=>m.photo===d.photo)) photoDel(d.photo); }
}
$('#photoIn').addEventListener('change',onPhotoPicked);
$('#photoCam').addEventListener('change',onPhotoPicked);
$('#viewer').addEventListener('click',()=>{ $('#viewer').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#viewer').hidden) $('#viewer').hidden=true; });
async function photosForBackup(){
  const out={};
  for(const m of mats){ if(!m.photo) continue; try{ const b=await photoGet(m.photo); if(b) out[m.photo]=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }catch(e){} }
  return out;
}
async function photosFromBackup(map){
  for(const [id,url] of Object.entries(map||{})){ try{ const b=await (await fetch(url)).blob(); await photoPut(id,b); delete photoURL[id]; }catch(e){} }
}

$('#btnExport').addEventListener('click',async ()=>{
  toast('백업 파일을 만드는 중…');
  const photos=await photosForBackup();
  const data=JSON.stringify({app:'jcost',v:2,saved:new Date().toISOString(),book,rates,projects,curId,mats,photos});
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  const name=`개략공사비_백업_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  if(NATIVE){
    try{
      const fname = `gaeryak_backup_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
      const r = await nativeCall('Filesystem','writeFile',{path:fname, data, directory:'CACHE', encoding:'utf8'});
      await nativeCall('Share','share',{title:fname, files:[r.uri], dialogTitle:'백업 파일 보관할 곳 선택'});
      toast('백업 파일을 보관할 곳(드라이브, 카톡 나에게 보내기 등)을 고르세요');
    }catch(err){
      if(!/cancel/i.test(String(err&&err.message))) toast('백업 파일을 만들지 못했어요');
    }
    return;
  }
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  toast('백업 파일을 저장했어요 ('+name+')');
});
$('#btnImport').addEventListener('click',()=>{
  const b=$('#btnImport');
  if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='지금 데이터를 덮어써요 · 한 번 더'; setTimeout(()=>{ b.classList.remove('arm'); b.textContent='백업 불러오기'; },3000); return; }
  b.classList.remove('arm'); b.textContent='백업 불러오기'; $('#fileImport').click();
});
$('#fileImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=='jcost'||!d.book||!Array.isArray(d.book.items)||!d.projects) throw 0;
      book=d.book; rates={...defaultRates(),...d.rates}; projects=d.projects; curId=d.curId;
      if(Array.isArray(d.mats)) mats=d.mats;
      await photosFromBackup(d.photos);
      if(!Object.keys(projects).length){ const p=sampleProject(book); projects[p.id]=p; }
      if(!projects[curId]) curId=Object.keys(projects)[0];
      schedule('all'); render(); toast('백업을 불러왔어요');
    }catch(err){ toast('이 앱의 백업 파일이 아니에요. 파일을 확인해 주세요'); }
    e.target.value='';
  };
  r.readAsText(f);
});

init();
})();
</script>
